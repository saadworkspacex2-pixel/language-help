<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 48" width="270" height="48" role="img" aria-label="Language Help BD">
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6169"/>
      <stop offset="46%" stop-color="#E51A24"/>
      <stop offset="100%" stop-color="#AF1119"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4D6DC"/>
      <stop offset="52%" stop-color="#9A9CA2"/>
      <stop offset="100%" stop-color="#6C6C72"/>
    </linearGradient>
    <radialGradient id="gloss" cx="34%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- brass rim + red enamel face -->
  <circle cx="24" cy="24" r="22.5" fill="url(#brass)"/>
  <circle cx="24" cy="24" r="22.5" fill="none" stroke="#7A5A16" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="24" cy="24" r="18.5" fill="url(#enamel)"/>
  <circle cx="24" cy="24" r="18.5" fill="none" stroke="#8C0D14" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="24" cy="24" r="18.5" fill="url(#gloss)"/>
  <text x="24" y="33.2" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="23" font-weight="700" fill="#F7F9F9">L</text>

  <!-- wordmark -->
  <text x="55" y="26.5" font-family="Inter, -apple-system, 'Segoe UI', sans-serif"
        font-size="21.5" font-weight="800" letter-spacing="-0.7" fill="#202026">Language Help<tspan fill="#E51A24"> BD</tspan></text>
  <text x="56" y="39.5" font-family="Inter, -apple-system, 'Segoe UI', sans-serif"
        font-size="7.2" font-weight="750" letter-spacing="2.1" fill="#8B8D93">LANGUAGE ACADEMY</text>
</svg>
